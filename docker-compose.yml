version: '3.8'

services:
  # Frontend - React + Vite
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      - backend
    networks:
      - sih26099-network

  # Backend - FastAPI
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - DATA_DIR=/app/data
      - RAW_DATA_PATH=/app/data/raw/CPSE_Material_Master_cleaned.csv
    volumes:
      - ./data:/app/data
    depends_on:
      - database
    networks:
      - sih26099-network

  # Database - PostgreSQL (optional if using Supabase)
  database:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sih26099
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sih26099-network
    # Comment out this service if using Supabase

networks:
  sih26099-network:
    driver: bridge

volumes:
  postgres_data:
