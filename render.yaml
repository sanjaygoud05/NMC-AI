services:
  # Python FastAPI Backend
  - type: web
    name: nmc-ai-backend
    runtime: python
    region: oregon
    plan: starter        # Starter required — torch/sentence-transformers needs >512 MB RAM
    buildCommand: "pip install -r server/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir server --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATA_DIR
        value: "data"
      - key: ALLOWED_ORIGINS
        value: "https://nmc-ai.vercel.app"   # ← update to your actual Vercel URL
      - key: DATABASE_URL
        fromDatabase:
          name: nmc-ai-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false   # set manually in Render dashboard
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: nmc-ai-db
    region: oregon
    plan: free
