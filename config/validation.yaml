# Phase 6: Technical Validation & Review Preparation Configuration

thresholds:
  validated_compatible: 0.85
  probable_compatible: 0.70
  review_required: 0.50
  insufficient_attributes_min: 2
  hard_incompatible_cap: 0.399

penalties:
  hard_incompatible: 0.50
  soft_difference: 0.15
  upstream_conflict: 0.05
  insufficient_evidence: 0.10

weights:
  refined_base: 0.50
  verified_attribute_agreement: 0.35
  canonical_key_signal: 0.15

core_attributes:
  - material_family
  - material_type
  - material
  - material_grade
  - size
  - nominal_size
  - pressure_class
  - standard
  - rating

status_taxonomy:
  - VALIDATED_COMPATIBLE
  - PROBABLE_COMPATIBLE
  - REVIEW_REQUIRED
  - ENGINEERING_INCOMPATIBLE
  - INSUFFICIENT_EVIDENCE

priority_taxonomy:
  - CRITICAL
  - HIGH
  - MEDIUM
  - LOW
